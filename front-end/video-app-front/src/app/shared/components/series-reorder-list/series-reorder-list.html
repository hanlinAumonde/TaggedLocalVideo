@if (items().length === 0) {
  <p class="text-xs text-gray-500 dark:text-gray-400 italic px-2 py-1">
    {{ emptyHint() }}
  </p>
} @else {
  <ol class="flex flex-col gap-1 p-2 bg-gray-50 dark:bg-gray-700 rounded-lg max-h-60 overflow-y-auto">
    @for (item of items(); track item.id; let i = $index) {
      <li
        class="flex items-center gap-2 px-2 py-1 rounded"
        [class.bg-white]="item.id !== highlightId()"
        [class.dark:bg-gray-600]="item.id !== highlightId()"
        [class.bg-blue-100]="item.id === highlightId()"
        [class.dark:bg-blue-900/30]="item.id === highlightId()"
        [class.ring-1]="item.id === highlightId()"
        [class.ring-blue-500]="item.id === highlightId()">
        <span class="text-xs font-mono w-6 text-right text-gray-500">{{ i + 1 }}.</span>
        <span class="flex-1 text-sm truncate" [matTooltip]="item.name">{{ item.name }}</span>
        <button
          mat-icon-button
          type="button"
          aria-label="Move up"
          [disabled]="!canMoveUp(i)"
          (click)="moveUp(i)">
          <mat-icon class="text-base!">arrow_upward</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          aria-label="Move down"
          [disabled]="!canMoveDown(i)"
          (click)="moveDown(i)">
          <mat-icon class="text-base!">arrow_downward</mat-icon>
        </button>
      </li>
    }
  </ol>
}
